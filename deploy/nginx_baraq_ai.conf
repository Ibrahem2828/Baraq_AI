# Place the AI location before the generic /api/ backend location.
upstream baraq_django_backend {
    server baraq-backend:8000;
    keepalive 32;
}

upstream baraq_ai_service {
    server baraq-ai-api:8000;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name api.barraq.xn--mgbaab0cxheq.tech;

    client_max_body_size 10m;

    location /api/ai/v1/ {
        proxy_pass http://baraq_ai_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /api/ {
        proxy_pass http://baraq_django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}
