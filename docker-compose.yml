services:
  ai-api:
    build: .
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8000"
    restart: unless-stopped

  ai-worker:
    build: .
    env_file: .env
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO --concurrency=2 --queues=ai_default,ai_audio,ai_embeddings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  ai-beat:
    build: .
    env_file: .env
    command: celery -A app.workers.celery_app:celery_app beat --loglevel=INFO
    depends_on:
      - redis
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: baraq_ai
      POSTGRES_USER: baraq_ai
      POSTGRES_PASSWORD: change_me
    volumes:
      - baraq_ai_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baraq_ai -d baraq_ai"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - baraq_ai_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  baraq_ai_postgres:
  baraq_ai_redis:
